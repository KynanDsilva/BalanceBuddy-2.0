<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BalanceBuddy - Home</title>
    <link rel="stylesheet" href="home.css">
    <link rel="icon" href="images/BB.ico">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="images/balancebuddy-high-resolution-logo-transparent.png" alt="Logo" class="logo-icon">
                <span class="logo-text">BalanceBuddy</span>
            </div>

            <nav class="sidebar-menu">
                <a href="friends.html" class="menu-item" id="friends-link">
                    <i class='bx bxs-user-account'></i>
                    <span>Friends</span>
                </a>
                <a href="chat.html" class="menu-item" id="chat-link">
                    <i class='bx bxs-chat'></i>
                    <span>Chat</span>
                </a>
                <a href="balance.html" class="menu-item" id="balance-link">
                    <i class='bx bxs-wallet-alt'></i>
                    <span>Balance</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="user.html" class="menu-item" id="user-profile-link">
                    <i class='bx bxs-user-circle'></i>
                    <span>Profile</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="welcome-container">
                <h1>Welcome to BalanceBuddy</h1>
                <p>Select an option from the sidebar to get started.</p>
            </div>
        </main>
    </div>
    <script type="module" src="home.js"></script>
</body>
</html>
