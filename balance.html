<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BalanceBuddy - Debt Tracker</title>
    <link rel="stylesheet" href="balance.css">
    <link rel="icon" href="images/BB.ico">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <a href="home.html" class="btn home-button"><i class='bx bx-home'></i> Home</a>
    
    <header class="balance-header">
        <h1>Debt Tracker</h1>
    </header>

    <main>
        <section class="card form-section">
            <h2>Add New Debt</h2>
            <form id="debt-form">
                <div class="input-group">
                    <label for="debtor-name">Debtor's Name</label>
                    <input type="text" id="debtor-name" class="input-field" placeholder="Enter debtor's name" required>
                </div>
                <div class="input-group">
                    <label for="amount">Amount Owed (₹)</label>
                    <input type="number" id="amount" class="input-field" placeholder="Enter amount" required>
                </div>
                <div class="input-group">
                    <label for="interest-rate">Interest Rate (% per month)</label>
                    <input type="number" id="interest-rate" class="input-field" placeholder="Max 2%" step="0.01" min="0" max="2">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Add Debt</button>
            </form>
        </section>

        <section class="card debt-list-section">
            <h2>Owed Debts</h2>
            <ul id="debt-list">
                <!-- Debt items will be dynamically inserted here -->
            </ul>
        </section>
    </main>

    <script src="balance.js" type="module"></script>
</body>
</html>
